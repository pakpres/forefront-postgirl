services:
  forefront-postgirl:
    build:
      context: ../forefront-postgirl
      dockerfile: Dockerfile.production
      args:
        progress: plain
    environment:
      - NODE_ENV=production
    env_file:
      - ../forefront-postgirl/.env.production
    restart: on-failure:0
    networks:
      - web
networks:
  web:
    driver: bridge
