services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "8002:8002"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - web
    environment:
      - NODE_ENV=development
    env_file:
      - .env.local
networks:
  web:
    driver: bridge